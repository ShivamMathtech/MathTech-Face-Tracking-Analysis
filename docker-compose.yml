services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:8080:80'
    restart: unless-stopped
  backend:
    profiles: ['backend']
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - mathtech-data:/app/backend/data
    restart: unless-stopped
volumes:
  mathtech-data:
